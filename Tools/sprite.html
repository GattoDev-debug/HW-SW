
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>png to hw-sw code</title>
<style>
  :root{
    --bg:#141516;
    --panel:#1c1e20;
    --line:#2c2f31;
    --accent:#7fb8a4;
    --accent2:#e8b04b;
    --text:#e9e9e7;
    --dim:#98a0a6;
    --mono:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    padding:32px 20px 60px;
  }
  h1{
    font-size:20px;
    font-weight:600;
    letter-spacing:0.2px;
    margin:0 0 4px;
  }
  .sub{
    color:var(--dim);
    font-size:13px;
    margin:0 0 28px;
  }
  .wrap{
    max-width:980px;
    margin:0 auto;
  }
  .grid{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:20px;
  }
  @media (max-width:820px){
    .grid{grid-template-columns:1fr;}
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
  }
  .panel + .panel{margin-top:16px;}
  label{
    display:block;
    font-size:12px;
    color:var(--dim);
    margin:14px 0 6px;
    text-transform:uppercase;
    letter-spacing:0.6px;
  }
  label:first-of-type{margin-top:0;}
  input[type=number]{
    width:100%;
    background:#101112;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:8px 10px;
    font-family:var(--mono);
    font-size:13px;
  }
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:22px 14px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    font-size:13px;
    color:var(--dim);
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--accent);
    background:#1a2420;
    color:var(--text);
  }
  .dropzone input{display:none;}
  .checkline{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    margin-top:14px;
    color:var(--text);
  }
  .checkline input{accent-color:var(--accent);}
  select{
    width:100%;
    background:#101112;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:8px 10px;
    font-family:var(--mono);
    font-size:13px;
  }
  button{
    width:100%;
    margin-top:18px;
    background:var(--accent);
    color:#0d1210;
    border:none;
    border-radius:7px;
    padding:11px 14px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:filter .15s;
  }
  button:hover{filter:brightness(1.08);}
  button:disabled{
    background:var(--line);
    color:var(--dim);
    cursor:not-allowed;
  }
  button.secondary{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    margin-top:8px;
  }
  #canvasWrap{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:180px;
    background:
      linear-gradient(45deg,#232525 25%,transparent 25%),
      linear-gradient(-45deg,#232525 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#232525 75%),
      linear-gradient(-45deg,transparent 75%,#232525 75%);
    background-size:16px 16px;
    background-position:0 0, 0 8px, 8px -8px, -8px 0px;
    background-color:#1a1a1a;
    border-radius:8px;
    border:1px solid var(--line);
    overflow:hidden;
  }
  #preview{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  .dim-readout{
    font-family:var(--mono);
    font-size:12px;
    color:var(--dim);
    text-align:center;
    margin-top:8px;
  }
  textarea{
    width:100%;
    height:420px;
    background:#0f1011;
    border:1px solid var(--line);
    border-radius:8px;
    color:#c9e8d8;
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.5;
    padding:14px;
    resize:vertical;
    white-space:pre;
  }
  .toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:10px;
  }
  .toolbar button{
    width:auto;
    margin-top:0;
    padding:8px 14px;
    font-size:12.5px;
  }
  .status{
    font-size:12px;
    color:var(--accent2);
    margin-left:auto;
  }
  .panel h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--dim);
    margin:0 0 12px;
    font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div>
      <div class="panel">
        <h2>Source</h2>
        <div class="dropzone" id="dropzone">
          Click or drop a PNG here
          <input type="file" id="fileInput" accept="image/png,image/*">
        </div>

        <label>Output size (pixels)</label>
        <div class="row">
          <div>
            <input type="number" id="outW" min="1" max="256" value="5">
          </div>
          <div>
            <input type="number" id="outH" min="1" max="256" value="5">
          </div>
        </div>
        <div class="checkline">
          <input type="checkbox" id="lockAspect">
          <label style="margin:0;text-transform:none;letter-spacing:0;color:var(--text)">Lock aspect ratio to source image</label>
        </div>

        <label>Alpha threshold for transparent</label>
        <input type="number" id="alphaThresh" min="0" max="255" value="10">

        <label>Variable name</label>
        <input type="text" id="varName" value="soul" style="font-family:var(--mono);">
      </div>

      <div class="panel">
        <h2>Preview</h2>
        <div id="canvasWrap">
          <canvas id="preview" width="5" height="5"></canvas>
        </div>
        <div class="dim-readout" id="dimReadout">no image loaded</div>
        <button id="generateBtn" disabled>Generate array</button>
      </div>
    </div>

    <div class="panel">
      <h2>GDScript output</h2>
      <div class="toolbar">
        <button class="secondary" id="copyBtn">Copy to clipboard</button>
        <span class="status" id="copyStatus"></span>
      </div>
      <textarea id="output" spellcheck="false" placeholder="Load a PNG and click Generate to see the array here."></textarea>
    </div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const dropzone = document.getElementById('dropzone');
const preview = document.getElementById('preview');
const ctx = preview.getContext('2d', { willReadFrequently: true });
const outW = document.getElementById('outW');
const outH = document.getElementById('outH');
const lockAspect = document.getElementById('lockAspect');
const alphaThresh = document.getElementById('alphaThresh');
const varName = document.getElementById('varName');
const generateBtn = document.getElementById('generateBtn');
const output = document.getElementById('output');
const copyBtn = document.getElementById('copyBtn');
const copyStatus = document.getElementById('copyStatus');
const dimReadout = document.getElementById('dimReadout');

let sourceImg = null;
let srcAspect = 1;

function loadImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      sourceImg = img;
      srcAspect = img.width / img.height;
      outW.value = img.width <= 64 ? img.width : 32;
      outH.value = Math.round(outW.value / srcAspect) || 1;
      generateBtn.disabled = false;
      renderPreview();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => loadImageFile(fileInput.files[0]));
['dragover','dragenter'].forEach(evt => dropzone.addEventListener(evt, e => {
  e.preventDefault(); dropzone.classList.add('drag');
}));
['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => {
  e.preventDefault(); dropzone.classList.remove('drag');
}));
dropzone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) loadImageFile(file);
});

function currentDims() {
  let w = Math.max(1, parseInt(outW.value) || 1);
  let h = Math.max(1, parseInt(outH.value) || 1);
  return {w, h};
}

outW.addEventListener('input', () => {
  if (lockAspect.checked && sourceImg) {
    outH.value = Math.max(1, Math.round((parseInt(outW.value)||1) / srcAspect));
  }
  renderPreview();
});
outH.addEventListener('input', () => {
  if (lockAspect.checked && sourceImg) {
    outW.value = Math.max(1, Math.round((parseInt(outH.value)||1) * srcAspect));
  }
  renderPreview();
});

function renderPreview() {
  if (!sourceImg) return;
  const {w, h} = currentDims();
  preview.width = w;
  preview.height = h;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(sourceImg, 0, 0, w, h);

  const displayScale = Math.max(1, Math.floor(240 / Math.max(w, h)));
  preview.style.width = (w * displayScale) + 'px';
  preview.style.height = (h * displayScale) + 'px';

  dimReadout.textContent = `${w} × ${h} px`;
}

function fmt(n) {
  // trim to a sane number of decimals, drop trailing zeros
  let s = n.toFixed(6);
  s = s.replace(/0+$/,'').replace(/\.$/,'');
  if (s === '' || s === '-0') s = '0';
  return s;
}

function generateArray() {
  if (!sourceImg) return;
  const {w, h} = currentDims();
  const thresh = Math.max(0, Math.min(255, parseInt(alphaThresh.value) || 0));
  const name = (varName.value.trim() || 'soul').replace(/[^A-Za-z0-9_]/g, '_');

  const data = ctx.getImageData(0, 0, w, h).data;

  const lines = [];
  lines.push(`const ${name} = [`);
  for (let y = 0; y < h; y++) {
    const rowVals = [];
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const r255 = data[i], g255 = data[i+1], b255 = data[i+2], a255 = data[i+3];
      if (a255 <= thresh) {
        rowVals.push('Color.TRANSPARENT');
        continue;
      }
      const r = r255/255, g = g255/255, b = b255/255, a = a255/255;
      if (a255 === 255) {
        rowVals.push(`Color(${fmt(r)},${fmt(g)},${fmt(b)})`);
      } else {
        rowVals.push(`Color(${fmt(r)},${fmt(g)},${fmt(b)},${fmt(a)})`);
      }
    }
    const comma = y < h - 1 ? ',' : '';
    lines.push(`\t[${rowVals.join(',')}]${comma}`);
  }
  lines.push(']');

  output.value = lines.join('\n');
}

generateBtn.addEventListener('click', generateArray);

copyBtn.addEventListener('click', async () => {
  if (!output.value) return;
  try {
    await navigator.clipboard.writeText(output.value);
    copyStatus.textContent = 'Copied!';
  } catch (e) {
    output.select();
    document.execCommand('copy');
    copyStatus.textContent = 'Copied!';
  }
  setTimeout(() => copyStatus.textContent = '', 1600);
});
</script>
</body>
</html>
