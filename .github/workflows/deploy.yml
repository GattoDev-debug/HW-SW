name: Build and deploy Pages (with wiki)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-src

      - name: Convert wiki pages into Jekyll pages
        run: |
          mkdir -p wiki
          for f in wiki-src/*.md; do
            name=$(basename "$f" .md)
            {
              echo "---"
              echo "layout: default"
              echo "title: \"${name//-/ }\""
              echo "permalink: /wiki/${name}/"
              echo "---"
              echo
              cat "$f"
            } > "wiki/${name}.md"
          done

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: |
          gem install bundler jekyll
          if [ -f Gemfile ]; then bundle install; fi

      - name: Build site
        run: bundle exec jekyll build || jekyll build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
